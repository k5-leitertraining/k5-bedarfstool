<div data-bdtl="track-point--open" class="relative cursor-pointer flex-0">
  <div
    data-bdtl="track-point__number"
    class="flex items-center justify-center w-8 h-8 text-center rounded-full text-slate-700 bg-slate-200"
  >
    {{number}}
  </div>
  <div class="absolute hidden md:flex flex-col items-center w-0 left-1/2">
    <div data-bdtl="track-point__name" class="text-center">{{name}}</div>
  </div>
</div>
