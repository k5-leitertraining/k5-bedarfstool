<div data-bdtl="question-root" class="flex items-stretch max-w-4xl mx-auto">
  <question-arrow
    direction="left"
    @click="onArrowLeft"
    :disabled="isFirstQuestion"
  />

  <div data-bdtl="question-container" class="flex-grow">
    <Transition
      mode="out-in"
      class="duration-200"
      :enter-from-class="`opacity-0 ${isBackwardMoving ? '-translate-x-6' : 'translate-x-6'}`"
      enter-to-class="opacity-100 translate-x-0"
      leave-from-class="opacity-100 translate-x-0"
      :leave-to-class="`opacity-0 ${isBackwardMoving ? 'translate-x-6' : '-translate-x-6'}`"
    >
      <question
        :question="currentQuestion"
        :key="currentQuestionKey"
        @update:answer="setCurrentQuestionAnswer($event.index, $event.value)"
      />
    </Transition>
  </div>

  <question-arrow
    direction="right"
    @click="onArrowRight"
    :disabled="isLastQuestion"
  />
</div>
